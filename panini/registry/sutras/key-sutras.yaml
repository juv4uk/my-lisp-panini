# Key Sutras for panini-foundation-v0.1
# These are the sutras directly referenced in our derivations.
# slp1: SLP1 transliteration of sutra text
# meaning_en: English translation
---
key_sutras:
  "1.1.1":
    slp1: "vRdDirAdEc"
    meaning_en: "The letters आ, ऐ and  औ are called 'वृद्धि'."
  "1.1.2":
    slp1: "adenguRaH"
    meaning_en: "The letters अ, ए and ओ are called 'गुण'."
  "1.3.2":
    slp1: "upadeSe'janunAsika it"
    meaning_en: "An अनुनासिक स्वर present in an उपदेश is called 'इत्'."
  "1.3.3":
    slp1: "halantyam"
    meaning_en: "The ending हल् letter of  an उपदेश is called 'इत्'."
  "1.3.7":
    slp1: "cutuS ca"
    meaning_en: "The letters - च्, छ्, ज्, झ्, ञ्, ट्, ठ्, ड्, ढ्, ण् -  at the beginning of the औपदेशिक form of a प्रत्यय are called इत् ।"
  "1.3.9":
    slp1: "tasya lopaH"
    meaning_en: "The इत् letter is elided during the प्रक्रिया."
  "1.4.2":
    slp1: "vipratiSeDe paraM kAryam"
    meaning_en: "If two sutras that can be invoked independent of each other happen to conflict at the same step during a प्रक्रिया, then the later occurring sutra gets applied by precedence."
  "1.4.24":
    slp1: "Druvam apAye 'pAdAnam"
    meaning_en: ""
  "1.4.32":
    slp1: "karmaRA yam aBipraiti sampradAnam"
    meaning_en: ""
  "1.4.42":
    slp1: "sADakatamaM karaRam"
    meaning_en: ""
  "1.4.45":
    slp1: "ADAro 'DikaraRam"
    meaning_en: ""
  "1.4.49":
    slp1: "kartur IpsitatamaM karma"
    meaning_en: ""
  "1.4.54":
    slp1: "svatantraH kartA"
    meaning_en: ""
  "3.1.68":
    slp1: "kartari Sap"
    meaning_en: "A verb gets the विकरणप्रत्यय 'शप्' in presence of a सार्वधातुक प्रत्यय in कर्तरि प्रयोग."
  "3.2.123":
    slp1: "vartamAne laT"
    meaning_en: ""
  "3.4.78":
    slp1: "tiptasjhi..."
    meaning_en: "A लकार is initially converted to one of these 18 आदेशाः - तिप्, तस्, झि, सिप्, थस्, थ, मिप्, वस्, मस्, त, आताम्, झ, थास्, आथाम्, ध्वम्, इड्, वहि, महिङ्."
  "6.1.78":
    slp1: "eco 'yavAyAvaH"
    meaning_en: "When followed by a स्वर, the letters of the एच् प्रत्याहार are respectively converted to अय्, अव्, आय् and आव् in the context of संहिता."
  "7.3.84":
    slp1: "sArvaDAtukarDADAtukayoH"
    meaning_en: "When followed by an सार्वधातुक or an आर्धधातुक प्रत्यय, an इगन्त अङ्ग gets a गुणादेश."