sutras:
  1.1.1:
    devanagari: वृद्धिरादैच्
    slp1: vfdDirAdEc
    meaning_en: The letters आ, ऐ and  औ are called 'वृद्धि'.
    type: samjna
  1.1.2:
    devanagari: अदेङ् गुणः
    slp1: adeN guRaH
    meaning_en: The letters अ, ए and ओ are called 'गुण'.
    type: samjna
  1.1.3:
    devanagari: इको गुणवृद्धी
    slp1: iko guRavfdDI
    meaning_en: If the words गुण or वृद्धि are used to denote the operation of  गुणादेश
      or वृद्धि-आदेश without specifying where such an
    type: vidhi
  1.1.4:
    devanagari: न धातुलोप आर्धधातुके
    slp1: na DAtulopa ArDaDAtuke
    meaning_en: If a part of धातु gets removed due to an आर्धधातुक प्रत्यय, then that
      प्रत्यय cannot cause any  गुण or वृद्धि on the इक्
    type: vidhi
  1.1.5:
    devanagari: क्क्ङिति च
    slp1: kkNiti ca
    meaning_en: In presence of a कित्,  गित् or a ङित् प्रत्यय, any गुण or वृद्धि
      that might happen on an इक्-letter of an अङ्ग is prohi
    type: vidhi
  1.1.6:
    devanagari: दीधीवेवीटाम्
    slp1: dIDIvevIwAm
    meaning_en: The इक् letter of - (a) the verb दीधीङ्,  (b) The verb वेवीङ् , and
      (c) इडागम - do not undergo a गुण or a वृद्धि.
    type: vidhi
  1.1.7:
    devanagari: हलोऽनन्तराः संयोगः
    slp1: halo'nantarAH saMyogaH
    meaning_en: Group of two or more  व्यञ्जनानि pronounced together without any स्वर
      or a pause between them is referred as संयोग.
    type: vidhi
  1.1.8:
    devanagari: मुखनासिकावचनोऽनुनासिकः
    slp1: muKanAsikAvacano'nunAsikaH
    meaning_en: A letter whose pronunciation needs the usage of nose as well as mouth
      is called an अनुनासिक.
    type: samjna
  1.1.9:
    devanagari: तुल्यास्यप्रयत्नं सवर्णम्
    slp1: tulyAsyaprayatnaM savarRam
    meaning_en: Two letters are called सवर्ण of each other if their mouth-based location
      of pronunciation and their आभ्यन्तरप्रयत्न are
    type: samjna
  1.1.10:
    devanagari: नाज्झलौ
    slp1: nAjJalO
    meaning_en: A स्वर and a व्यञ्जन cannot be सवर्ण of each other.
    type: vidhi
  1.1.11:
    devanagari: ईदूदेद्द्विवचनं प्रगृह्यम्
    slp1: IdUdeddvivacanaM pragfhyam
    meaning_en: दीर्घ-ईकारान्त, दीर्घ-ऊकारान्त and एकारान्त forms of द्विवचन are known
      as 'प्रगृह्य'.
    type: vidhi
  1.1.12:
    devanagari: अदसो मात्
    slp1: adaso mAt
    meaning_en: The forms of the अदस् word which end in मी / मू / मे are known as
      'प्रगृह्य'.
    type: vidhi
  1.1.13:
    devanagari: शे
    slp1: Se
    meaning_en: '''शे'' is called प्रगृह्य.'
    type: samjna
  1.1.14:
    devanagari: निपात एकाजनाङ्
    slp1: nipAta ekAjanAN
    meaning_en: Except for the word आङ्, all other निपाताः that contain only one स्वर
      (and no व्यञ्जन) are known as प्रगृह्य.
    type: vidhi
  1.1.15:
    devanagari: ओत्
    slp1: ot
    meaning_en: All ओकारान्त निपातs are known as प्रगृह्य.
    type: vidhi
  1.1.16:
    devanagari: सम्बुद्धौ शाकल्यस्येतावनार्षे
    slp1: sambudDO SAkalyasyetAvanArze
    meaning_en: According to Shakalya, the ओकार at end of the सम्बोधन-एकवचन form,
      when followed by the word 'इति' in a non vedic context
    type: vidhi
  1.1.17:
    devanagari: उञः
    slp1: uYaH
    meaning_en: According to Shakalya, the निपात 'उञ्', when followed by the word
      'इति' in a non vedic context, gets the term 'प्रगृह्य'
    type: vidhi
  1.1.18:
    devanagari: ऊँ
    slp1: U~
    meaning_en: According to Shakalya, the 'उञ्' when followed by the अवैदिक  'इति'
      word  gets optionally converted to प्रगृह्य ऊँ.
    type: vidhi
  1.1.19:
    devanagari: ईदूतौ च सप्तम्यर्थे
    slp1: IdUtO ca saptamyarTe
    meaning_en: An  ईकारान्त and an ऊकारान्त word that represents the meaning of सप्तमी
      gets the term 'प्रगृह्य'.
    type: vidhi
  1.1.20:
    devanagari: दाधा घ्वदाप्
    slp1: dADA GvadAp
    meaning_en: Except for the verbs दाप् and दैप्, all other verbs that are referred
      to as 'दारूपाः' or 'धारूपाः' are known as 'घु'.
    type: vidhi
  1.1.21:
    devanagari: आद्यन्तवदेकस्मिन्
    slp1: Adyantavadekasmin
    meaning_en: If a word has a single letter, it acts as the first letter, and it
      also acts as the last letter.
    type: vidhi
  1.1.22:
    devanagari: तरप्तमपौ घः
    slp1: taraptamapO GaH
    meaning_en: The तरप् प्रत्यय and the तमप् प्रत्यय are known as 'घ'
    type: vidhi
  1.1.23:
    devanagari: बहुगणवतुडति संख्या
    slp1: bahugaRavatuqati saMKyA
    meaning_en: The words बहु and गण, and the words ending in the वतुँप् and डति प्रत्यय
      are known as 'संख्या'.
    type: vidhi
  1.1.24:
    devanagari: ष्णान्ता षट्
    slp1: zRAntA zaw
    meaning_en: The षकारान्त and the नकारान्त words which are referred to as 'संख्या'
      are also called 'षट्'.
    type: vidhi
  1.1.25:
    devanagari: डति च
    slp1: qati ca
    meaning_en: The word ending in the डति प्रत्यय which is referred to as 'संख्या'
      is also called 'षट्'.
    type: vidhi
  1.1.26:
    devanagari: क्तक्तवतू निष्ठा
    slp1: ktaktavatU nizWA
    meaning_en: The 'क्त' and 'क्तवतु' pratyayas are called 'निष्ठा'.
    type: samjna
  1.1.27:
    devanagari: सर्वादीनि सर्वनामानि
    slp1: sarvAdIni sarvanAmAni
    meaning_en: The words belonging to the सर्वादिगण are called सर्वनाम.
    type: samjna
  1.1.28:
    devanagari: विभाषा दिक्समासे बहुव्रीहौ
    slp1: viBAzA diksamAse bahuvrIhO
    meaning_en: The words of सर्वादिगण in a दिशावाची बहुव्रीहि समास are optionally
      considered सर्वनाम.
    type: vidhi
  1.1.29:
    devanagari: न बहुव्रीहौ
    slp1: na bahuvrIhO
    meaning_en: The words of सर्वादिगण, when used to create a बहुव्रीहिसमास are not
      called सर्वनाम.
    type: vidhi
  1.1.30:
    devanagari: तृतीयासमासे
    slp1: tftIyAsamAse
    meaning_en: The words of the सर्वादिगण participating in a तृतीयासमास are not called
      सर्वनाम.
    type: vidhi
  1.1.31:
    devanagari: द्वन्द्वे च
    slp1: dvandve ca
    meaning_en: The words formed by the द्वन्द्व समास of the words of सर्वादिगण are
      not called सर्वनाम.
    type: vidhi
  1.1.32:
    devanagari: विभाषा जसि
    slp1: viBAzA jasi
    meaning_en: The words formed by the द्वन्द्व समास of the words of सर्वादिगण are
      optionally called सर्वनाम when they get the 'जस्' pr
    type: vidhi
  1.1.33:
    devanagari: प्रथमचरमतयाल्पार्धकतिपयनेमाश्च
    slp1: praTamacaramatayAlpArDakatipayanemASca
    meaning_en: The words - प्रथम, चरम, अल्प, अर्ध, कतिपय, and नेम ; and also the
      words ending in the 'तयप्' प्रत्यय are optionally call
    type: vidhi
  1.1.34:
    devanagari: पूर्वपरावरदक्षिणोत्तरापराधराणि
    slp1: pUrvaparAvaradakziRottarAparADarARi
    meaning_en: The words 'पूर्व', 'पर', 'अवर', 'दक्षिण', 'उत्तर', 'अपर' and 'अधर';
      when used in the sense of 'limit' but not as a prope
    type: vidhi
  1.1.35:
    devanagari: स्वमज्ञातिधनाख्यायाम्
    slp1: svamajYAtiDanAKyAyAm
    meaning_en: The word 'स्व', when used in a meaning different than 'relatives'
      and 'money'  is optionally called सर्वनाम when followe
    type: vidhi
  1.1.36:
    devanagari: अन्तरं बहिर्योगोपसंव्यानयोः
    slp1: antaraM bahiryogopasaMvyAnayoH
    meaning_en: The word  'अन्तर', when used in the meaning of 'outside a certain
      place' or 'undergarment', is optionally called 'सर्वना
    type: vidhi
  1.1.37:
    devanagari: स्वरादिनिपातमव्ययम्
    slp1: svarAdinipAtamavyayam
    meaning_en: The words of the स्वरादिगण and the words which are called 'निपात'
      are all also known as 'अव्यय'.
    type: samjna
  1.1.38:
    devanagari: तद्धितश्चासर्वविभक्तिः
    slp1: tadDitaScAsarvaviBaktiH
    meaning_en: A तद्धितान्त word to which all the विभक्तिप्रत्ययाः cannot be attached
      is known as 'अव्यय'.
    type: vidhi
  1.1.39:
    devanagari: कृन्मेजन्तः
    slp1: kfnmejantaH
    meaning_en: A word that ends in - (a) a मकारान्त कृत्-प्रत्यय,  or (b) a कृत्-प्रत्यय
      that ends in the एच् letter - is known as 'अव्
    type: vidhi
  1.1.40:
    devanagari: क्त्वातोसुन्कसुनः
    slp1: ktvAtosunkasunaH
    meaning_en: The words ending in क्त्वा, तोसुन् and कसुन् प्रत्यय are known as
      'अव्यय'.
    type: vidhi
  1.1.41:
    devanagari: अव्ययीभावश्च
    slp1: avyayIBAvaSca
    meaning_en: The word formed using an अव्ययीभाव समास are known as अव्यय.
    type: vidhi
  1.1.42:
    devanagari: शि सर्वनामस्थानम्
    slp1: Si sarvanAmasTAnam
    meaning_en: '''शि'' is also called ''सर्वनामस्थान''.'
    type: vidhi
  1.1.43:
    devanagari: सुडनपुंसकस्य
    slp1: suqanapuMsakasya
    meaning_en: The सुँ, औ, जस्, अम्, and औट् प्रत्ययाः attached to a non-नपुंसकलिङ्ग
      word are called 'सर्वनामस्थान'.
    type: samjna
  1.1.44:
    devanagari: न वेति विभाषा
    slp1: na veti viBAzA
    meaning_en: The word विभाषा is used to indicate the meaning of 'optional negation'
      and 'optional application'.
    type: vidhi
  1.1.45:
    devanagari: इग्यणः सम्प्रसारणम्
    slp1: igyaRaH samprasAraRam
    meaning_en: An 'इक्' letter that comes as a replacement for a 'यण्' letter is
      known as सम्प्रसारण.
    type: vidhi
  1.1.46:
    devanagari: आद्यन्तौ टकितौ
    slp1: AdyantO wakitO
    meaning_en: A टित्-आगम is attached before its substrate, and a कित्-आगम comes
      after its substrate.
    type: vidhi
  1.1.47:
    devanagari: मिदचोऽन्त्यात्परः
    slp1: midaco'ntyAtparaH
    meaning_en: A मित्-आगम is attached after the last स्वर of its substrate.
    type: vidhi
  1.1.48:
    devanagari: एच इग्घ्रस्वादेशे
    slp1: eca igGrasvAdeSe
    meaning_en: When an 'एच्' letter undergoes a हस्वादेश, it is replaced by an 'इक्'
      letter.
    type: vidhi
  1.1.49:
    devanagari: षष्ठी स्थानेयोगा
    slp1: zazWI sTAneyogA
    meaning_en: When the षष्ठी विभक्ति occurring in a sutra does not indicate a clear
      relationship,  it is considered to indicate the स्
    type: vidhi
  1.1.50:
    devanagari: स्थानेऽन्तरतमः
    slp1: sTAne'ntaratamaH
    meaning_en: Out of multiple आदेशाः possible in a place, the one that is closest
      in properties gets selected.
    type: vidhi
  1.1.51:
    devanagari: उरँण् रपरः
    slp1: ura~R raparaH
    meaning_en: Any अ, आ, इ, ई, उ, ऊ letter appearing as an आदेश in place of a ऋकार/ऌकार
      is always followed by the letter र्/ल् respecti
    type: vidhi
  1.1.52:
    devanagari: अलोऽन्त्यस्य
    slp1: alo'ntyasya
    meaning_en: आदेश told in a sutra happens in the place of the last letter of the
      स्थानी.
    type: vidhi
  1.1.53:
    devanagari: ङिच्च
    slp1: Nicca
    meaning_en: A ङित्-आदेश happens to the last letter of the  स्थानी.
    type: vidhi
  1.1.54:
    devanagari: आदेः परस्य
    slp1: AdeH parasya
    meaning_en: The आदेश told on the latter word of a given निमित्त happens on its
      first letter.
    type: vidhi
  1.1.55:
    devanagari: अनेकाल्शित्सर्वस्य
    slp1: anekAlSitsarvasya
    meaning_en: An आदेश which either has more than one letters, or is शित् - replaces
      the entire स्थानी.
    type: vidhi
  1.1.56:
    devanagari: स्थानिवदादेशोऽनल्विधौ
    slp1: sTAnivadAdeSo'nalviDO
    meaning_en: An आदेश acts like a स्थानी in the context of the operations that are
      not associated with a single letter.
    type: vidhi
  1.1.57:
    devanagari: अचः परस्मिन् पूर्वविधौ
    slp1: acaH parasmin pUrvaviDO
    meaning_en: An आदेश done in place of an अच् letter due to the परनिमित्त acts like
      the स्थानी even in the context of कार्याणि that ar
    type: vidhi
  1.1.58:
    devanagari: न पदान्तद्विर्वचनवरेयलोपस्वरसवर्णानुस्वारदीर्घजश्चर्विधिषु
    slp1: na padAntadvirvacanavareyalopasvarasavarRAnusvAradIrGajaScarviDizu
    meaning_en: An आदेश done in place of an अच् letter due to the परनिमित्त never
      acts like a स्थानी; even for the single-letter-कार्याण
    type: vidhi
  1.1.59:
    devanagari: द्विर्वचनेऽचि
    slp1: dvirvacane'ci
    meaning_en: An आदेश done in place of an अच् letter acts like a स्थानी for the
      द्वित्वकार्य, provided that such a द्वित्वकार्य is cau
    type: vidhi
  1.1.60:
    devanagari: अदर्शनं लोपः
    slp1: adarSanaM lopaH
    meaning_en: non-appearance of a letter or a group of letters is called लोप.
    type: samjna
  1.1.61:
    devanagari: प्रत्ययस्य लुक्‌श्लुलुपः
    slp1: pratyayasya luk‌SlulupaH
    meaning_en: The elision of a प्रत्यय done using the specific words लुक्, श्लु
      and लुप् is respectively known by the terms लुक्, श्लु
    type: vidhi
  1.1.62:
    devanagari: प्रत्ययलोपे प्रत्ययलक्षणम्
    slp1: pratyayalope pratyayalakzaRam
    meaning_en: The कार्य associated with a प्रत्यय happens even when the प्रत्यय
      undergoes a लोप.
    type: vidhi
  1.1.63:
    devanagari: न लुमताऽङ्गस्य
    slp1: na lumatA'Ngasya
    meaning_en: A प्रत्यय that has been removed लुक् , श्लु or लुप् does not cause
      any अङ्गकार्यम्.
    type: vidhi
  1.1.64:
    devanagari: अचोऽन्त्यादि टि
    slp1: aco'ntyAdi wi
    meaning_en: The fragment of a word starting from its last अच् letter till the
      end is called टि.
    type: samjna
  1.1.65:
    devanagari: अलोऽन्त्यात् पूर्व उपधा
    slp1: alo'ntyAt pUrva upaDA
    meaning_en: The second-last letter of a word is called उपधा.
    type: samjna
  1.1.66:
    devanagari: तस्मिन्निति निर्दिष्टे पूर्वस्य
    slp1: tasminniti nirdizwe pUrvasya
    meaning_en: The words in the सप्तमी विभक्ति are used to indicate that the कार्य
      happens on an immediately previous entity.
    type: vidhi
  1.1.67:
    devanagari: तस्मादित्युत्तरस्य
    slp1: tasmAdityuttarasya
    meaning_en: The words in the पञ्चमी विभक्ति are used to indicate that the कार्य
      happens on an immediately next entity.
    type: vidhi
  1.1.68:
    devanagari: स्वं रूपं शब्दस्याशब्दसंज्ञा
    slp1: svaM rUpaM SabdasyASabdasaMjYA
    meaning_en: The words used in the rules of the grammar represent the verbatim
      sequence of the letters (and not their underlying mean
    type: vidhi
  1.1.69:
    devanagari: अणुदित् सवर्णस्य चाप्रत्ययः
    slp1: aRudit savarRasya cApratyayaH
    meaning_en: An अण् letter which does not represent an आदेश, and an उदित letter
      (one of कु, चु, टु, तु, पु) used in a sutra represent
    type: vidhi
  1.1.70:
    devanagari: तपरस्तत्कालस्य
    slp1: taparastatkAlasya
    meaning_en: A letter that follows or is followed by 'त्' represents only those
      सवर्णाः which require the same time for pronunciation
    type: vidhi
  1.1.71:
    devanagari: आदिरन्त्येन सहेता
    slp1: Adirantyena sahetA
    meaning_en: A beginning letter, when combined with an ending इत् letter, stands
      for itself and for all the letters in between.
    type: vidhi
  1.1.72:
    devanagari: येन विधिस्तदन्तस्य
    slp1: yena viDistadantasya
    meaning_en: A विधि mentioned using an adjective happens in the context of that
      adjective, and also in context of the words which end
    type: vidhi
  1.1.73:
    devanagari: वृद्धिर्यस्याचामादिस्तद् वृद्धम्
    slp1: vfdDiryasyAcAmAdistad vfdDam
    meaning_en: A word whose first स्वर is वृद्धि is called 'वृद्ध'.
    type: samjna
  1.1.74:
    devanagari: त्यदादीनि च
    slp1: tyadAdIni ca
    meaning_en: The words of the त्यदादिगण are called  'वृद्ध'.
    type: samjna
  1.1.75:
    devanagari: एङ् प्राचां देशे
    slp1: eN prAcAM deSe
