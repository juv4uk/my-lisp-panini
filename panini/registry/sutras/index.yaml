  6.1.1:
    devanagari: एकाचो द्वे प्रथमस्य
    slp1: ekAco dve praTamasya
    meaning_en: In this अधिकार the doubling happens for the first एकाच् entity of
      the verb
    type: vidhi
  6.1.2:
    devanagari: अजादेर्द्वितीयस्य
    slp1: ajAderdvitIyasya
    meaning_en: The द्वित्व mandated in the <<एकाचो द्वे प्रथमस्य>> [[6.1.1]] अधिकार
      happens for the second एकाच् component of an अनेकाच
    type: vidhi
  6.1.3:
    devanagari: न न्द्राः संयोगादयः
    slp1: na ndrAH saMyogAdayaH
    meaning_en: When doubling of an अनेकाच् अजादि  verb root is to be done, the नकार,
      दकार, and रेफ present at the beginning of a संयोग
    type: vidhi
  6.1.4:
    devanagari: पूर्वोऽभ्यासः
    slp1: pUrvo'ByAsaH
    meaning_en: When a repetition is done, the first entity out of the two is called
      अभ्यास.
    type: samjna
  6.1.5:
    devanagari: उभे अभ्यस्तम्
    slp1: uBe aByastam
    meaning_en: When the doubling happens in this अधिकार, the two copies are collectively
      referred as 'अभ्यस्त'.
    type: vidhi
  6.1.6:
    devanagari: जक्षित्यादयः षट्
    slp1: jakzityAdayaH zaw
    meaning_en: The verb roots belonging to the जक्षित्यादिगण are called 'अभ्यस्त'.
    type: samjna
  6.1.7:
    devanagari: तुजादीनां दीर्घोऽभ्यासस्य
    slp1: tujAdInAM dIrGo'ByAsasya
