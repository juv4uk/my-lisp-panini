    slp1: liwi DAtoranaByAsasya
    meaning_en: When followed by a प्रत्यय of लिट् लकार,  a verb root that have not
      yet undergone द्वित्वम् undergoes द्वित्वम्.
    type: vidhi
  6.1.9:
    devanagari: सन्यङोः
    slp1: sanyaNoH
    meaning_en: When followed by the सन्-प्रत्यय or the  यङ्-प्रत्यय, a verb root
      that have not yet undergone द्वित्वम् undergoes द्वित्
    type: vidhi
