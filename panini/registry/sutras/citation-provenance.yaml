# Citation provenance registry — panini-foundation v0.1
#
# This is a reference layer, not a second sutra text.  `text_ref` points to the
# exact SLP1 and Devanagari fields in index.yaml.  A consumer must not replace
# that reference with a hand-normalized string without recording a new source.
#
# Verification states:
#   local-index: exact text exists in the committed local corpus; the external
#                import/provenance still needs a separately recorded source.
#   corpus-checked: cross-checked during PANINI-SUTRA-CITATION-VERIFICATION
#                   against the Sanskrit/learnsanskrit.org rule corpus.
#   needs-check: cited only as a secondary/range/implementation reference.

schema: panini-citation-provenance/v0.1
canonical_text_registry: index.yaml
source_policy:
  primary: "A cited Aṣṭādhyāyī corpus or critical edition."
  secondary: "Commentary and scholarly interpretation; never a replacement for primary text."
  implementation: "Vidyut, Heritage, and panini-machine may explain a model but cannot establish Paninian fact."

