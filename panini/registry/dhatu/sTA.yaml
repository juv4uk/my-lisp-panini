notes: >
  Корінь на довгий голосний — інша поведінка при guRa/vfdDi ніж у
  приголосних коренів. `source_form` у первинному Dhātupāṭha —
  ретрофлексне "zWA" (не дентальне "sTA") — це не декоративний
  it-маркер, а традиційна орфографія кореня. Нормалізовано до "sTA"
  за незалежним підтвердженням (`PANINI-DHATUPATHA-DISAMBIGUATION-POLICY`):
  цитатна форма "sthā" з дентальним `s` універсально визнана поза
  самим Dhātupāṭha (підручники, `my-lisp`, `PANINI-GRAMMAR-REFERENCE.md`).

