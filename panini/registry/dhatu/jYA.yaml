  (01.0923, 09.0043, 10.0258). Цей запис прив'язаний саме до
  09.0043 (avaboDane, "розуміння") — семантично найближче до
  "знати" й відповідає заявленому gaṇa 9; два інших див. у полі
  `homonyms`.

