# Cross-Repo Epistemic Imports (my-lisp-panini ← shiva-sutras)

*Реєстр односторонніх епістемічних імпортів із upstream-репозиторію `juv4uk/shiva-sutras`.*
*Правила — `AGENTS.md` §21b. Джерело статусів — `docs/claims-export.yaml` в `shiva-sutras`.*

Статус: **IMPORT REGISTRY** (постійний, оновлюється лише при зміні upstream-статусу)
Protocol revision: `a8391c41617331458e816698e5778971665f8436`

---

## Правила імпорту

1. `my-lisp-panini` **не** встановлює і не «покращує» фундаментальні факти про Śiva-sūtras; лише споживає явно експортовані claims.
2. Кожен імпорт містить `repository`, `claim`, `status_at_import`, `revision` та список споживачів у цьому репо.
3. Підвищення `status_at_import` локальним контекстом **заборонено**.
4. Якщо upstream-статус падає нижче `min_status` — споживачі позначаються `[REVALIDATE]` і не можуть слугувати foundation без перегляду.
5. `UNRESOLVED`-статус в upstream → тут лише `[EXPERIMENTAL HYPOTHESIS]`, не foundation.

